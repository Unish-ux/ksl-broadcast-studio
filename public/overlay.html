<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSL OBS Overlay</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:Arial,sans-serif;color:white}.bar{position:absolute;left:0;right:0;bottom:0;height:220px;display:flex;align-items:stretch;background:transparent}.team{width:150px;background:linear-gradient(120deg,#073b83,#0876bd);border-radius:0 0 0 18px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;border-right:4px solid #e6b82e}.score{width:390px;background:linear-gradient(110deg,#064ab7,#082b77);padding:22px 24px}.score strong{display:block;font-size:58px;line-height:1.1}.score small{font-size:24px}.toss{width:190px;background:#fff;color:#92252b;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:bold;padding:10px}.info{flex:1;background:linear-gradient(110deg,#092b85,#0055b9);display:flex;flex-direction:column;justify-content:center;text-align:center}.info b{font-size:30px}.info span{font-size:20px;margin-top:8px}.right{width:150px;background:linear-gradient(120deg,#a40046,#5d0031);border-left:4px solid #e6b82e;border-radius:0 0 18px 0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:-1}#bar{position:relative;width:100vw;height:220px}#bar.hidden{display:none}</style></head><body><div id="bar"><img id="bg" class="bg" hidden><div class="team" id="batTeam">TEAM A</div><div class="score"><strong id="score">0/0</strong><small id="overs">0.0 OVERS</small></div><div class="toss"><span id="toss">TOSS</span><span id="decision">ELECTED TO BAT</span></div><div class="info"><b id="title">KOSHI SUPER LEAGUE</b><span id="ground">CRICKET GROUND | NEPAL</span></div><div class="right" id="bowlTeam">TEAM B</div></div><script src="/socket.io/socket.io.js"></script><script>const el=id=>document.getElementById(id);function draw(s){el("bar").classList.toggle("hidden",!s.graphic.show);el("batTeam").textContent=s.teams.batting;el("bowlTeam").textContent=s.teams.bowling;el("score").textContent=s.score.runs+"/"+s.score.wickets;el("overs").textContent=Math.floor(s.score.balls/6)+"."+(s.score.balls%6)+" OVERS";el("toss").textContent=s.match.tossWinner?("TOSS: "+s.match.tossWinner):"TOSS";el("decision").textContent="ELECTED TO "+s.match.tossDecision;el("title").textContent=s.match.tournament+" | "+s.match.matchTitle;el("ground").textContent=s.match.ground+" | "+s.match.location;if(s.graphic.background){el("bg").src=s.graphic.background;el("bg").hidden=false}else el("bg").hidden=true}const socket=io();socket.on("state",draw);fetch("/api/state").then(r=>r.json()).then(draw);</script></body></html>
